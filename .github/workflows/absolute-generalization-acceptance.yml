name: Absolute Generalization Acceptance

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  absolute-preflight:
    name: Absolute input preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Verify current execution identity
        id: preflight
        run: >-
          uv run python scripts/run_absolute_generalization_acceptance.py
          --shard champion --preflight-only
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/absolute-preflight/manifest.json"
          --cache-dir "$RUNNER_TEMP/absolute-preflight-cache" --data-dir data/frozen
      - name: Upload preflight diagnostic
        if: ${{ !cancelled() && steps.preflight.outputs.diagnostic_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: absolute-preflight-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.preflight.outputs.diagnostic_path }}
          if-no-files-found: error

  absolute-shard:
    needs: absolute-preflight
    name: Absolute shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - champion
          - loo-a
          - loo-b
          - loo-c
          - loo-d
          - loo-e
          - loo-f
          - recovery-and-reachability
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Restore raw cell cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/absolute-generalization-cache
          key: >-
            absolute-generalization-${{ runner.os }}-${{ matrix.shard }}-
            ${{ hashFiles('uv.lock', 'data/frozen/SHA256SUMS',
            'benchmarks/absolute_generalization_acceptance_contract.json',
            'benchmarks/source_surface_registry.json', 'uquant/config/**',
            'uquant/contracts/universe/**', 'uquant/validation/absolute_generalization/**',
            'scripts/run_absolute_generalization_acceptance.py') }}
      - name: Run absolute shard
        id: execute
        run: >-
          uv run python scripts/run_absolute_generalization_acceptance.py
          --shard "${{ matrix.shard }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/absolute-generalization/manifest.json"
          --cache-dir "$RUNNER_TEMP/absolute-generalization-cache"
          --data-dir data/frozen
      - name: Explain execution and economic evaluation
        if: ${{ always() }}
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          MANIFEST_PATH: ${{ steps.execute.outputs.artifact_path }}
          DIAGNOSTIC_PATH: ${{ steps.execute.outputs.diagnostic_path }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          lines = ["## Absolute shard", "", "Execution: " + os.environ["EXECUTION_OUTCOME"],
                   "A complete execution supplies evidence; only final aggregation decides economic acceptance."]
          for name in ("MANIFEST_PATH", "DIAGNOSTIC_PATH"):
              path = Path(os.environ[name])
              if os.environ[name] and path.is_file():
                  document = json.loads(path.read_text())
                  lines.append(name + ": " + path.name)
                  for key in ("status", "error_type", "error"):
                      if key in document:
                          lines.append(key + ": " + str(document[key])[:2000])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(lines) + "\n")
          PYCODE
      - name: Upload sealed shard manifest
        if: ${{ !cancelled() && steps.execute.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: absolute-generalization-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ steps.execute.outputs.artifact_path }}
          if-no-files-found: error
      - name: Upload execution diagnostic
        if: ${{ !cancelled() && steps.execute.outputs.diagnostic_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: absolute-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ steps.execute.outputs.diagnostic_path }}
          if-no-files-found: error

  generalization-acceptance:
    name: Generalization Acceptance
    if: ${{ always() }}
    needs: [absolute-preflight, absolute-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report aggregation prerequisites
        env:
          PREFLIGHT_RESULT: ${{ needs.absolute-preflight.result }}
          SHARD_RESULT: ${{ needs.absolute-shard.result }}
        run: |
          printf '## Absolute aggregation\n\nPreflight: %s\n\nShard execution: %s\n\nMissing or invalid execution blocks formal aggregation. Complete valid economic misses remain failures in the final report. Inspect each shard summary and original diagnostic for precise causes.\n' "$PREFLIGHT_RESULT" "$SHARD_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful preflight and complete shard execution
        if: ${{ needs.absolute-preflight.result != 'success' || needs.absolute-shard.result != 'success' }}
        run: |
          echo "Preflight or shard execution failed; inspect its original diagnostic."
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Download every sealed shard manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: absolute-generalization-${{ github.run_id }}-attempt-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/absolute-generalization-shards
          merge-multiple: false
      - name: Aggregate exact eight shard manifests
        id: aggregate
        env:
          SHARD_JOB_RESULT: ${{ needs.absolute-shard.result }}
        run: >-
          uv run python scripts/run_absolute_generalization_acceptance.py
          --shard final
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/absolute-generalization-summary/report.json"
          --shard-root "$RUNNER_TEMP/absolute-generalization-shards"
          --artifact-prefix absolute-generalization
          --upstream-result "$SHARD_JOB_RESULT"
      - name: Upload sealed final report
        if: ${{ !cancelled() && steps.aggregate.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: absolute-generalization-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.aggregate.outputs.artifact_path }}
          if-no-files-found: error
      - name: Upload aggregation diagnostic
        if: ${{ !cancelled() && steps.aggregate.outputs.diagnostic_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: absolute-aggregation-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.aggregate.outputs.diagnostic_path }}
          if-no-files-found: error
