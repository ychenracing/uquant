name: Alpha canonical baselines
on:
  push:
    branches: [research/alpha-recovery]
    paths: ['.github/workflows/alpha-canonical-baselines.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: historical, ref: cf8fecff76564fd4ed87faa0da336a06d433fd93, pool: a}
          - {arm: historical, ref: cf8fecff76564fd4ed87faa0da336a06d433fd93, pool: e}
          - {arm: current, ref: 6f8de5c02ff1161b78ef42e63e91f36d35c6bfc0, pool: a}
          - {arm: current, ref: 6f8de5c02ff1161b78ef42e63e91f36d35c6bfc0, pool: e}
          - {arm: current, ref: 6f8de5c02ff1161b78ef42e63e91f36d35c6bfc0, pool: remove308-prefix}
    env:
      UV_PYTHON: "3.12.13"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Install pinned environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Run exact source in isolated checkout
        env:
          SOURCE_REF: ${{ matrix.ref }}
          POOL: ${{ matrix.pool }}
          ARM: ${{ matrix.arm }}
        run: |
          git worktree add --detach /tmp/alpha-baseline "$SOURCE_REF"
          mkdir -p /tmp/alpha-baseline-results
          if [ "$POOL" = "remove308-prefix" ]; then
            .venv/bin/python artifacts/alpha-recovery/canonical-baselines/native_prefix.py /tmp/alpha-baseline "/tmp/alpha-baseline-results/$ARM-$POOL.json.gz"
          else
            .venv/bin/python artifacts/alpha-recovery/replay.py --root /tmp/alpha-baseline --pool "$POOL" --start 2025-01-02 --end 2026-07-31 --output "/tmp/alpha-baseline-results/$ARM-$POOL.json.gz"
          fi
      - name: Preserve raw baseline and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-canonical-${{ matrix.arm }}-${{ matrix.pool }}-${{ github.sha }}
          path: /tmp/alpha-baseline-results
          if-no-files-found: warn
