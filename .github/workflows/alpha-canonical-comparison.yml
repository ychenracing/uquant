name: Alpha canonical comparison
on:
  push:
    branches: [research/alpha-recovery]
    paths: ['.github/workflows/alpha-canonical-comparison.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: historical, pool: a}
          - {arm: historical, pool: e}
          - {arm: current, pool: a}
          - {arm: current, pool: e}
          - {arm: current, pool: remove308-prefix}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34944241504
          name: alpha-canonical-${{ matrix.arm }}-${{ matrix.pool }}-3d1290a63ac580a2a7d16091244b41308d9fa731
          path: /tmp/canonical-baseline
      - name: Validate exact comparison and retain bytes
        env:
          ARM: ${{ matrix.arm }}
          POOL: ${{ matrix.pool }}
        run: python3 artifacts/alpha-recovery/canonical-baselines/readback.py "$ARM" "$POOL"
