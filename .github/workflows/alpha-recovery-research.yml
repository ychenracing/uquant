name: Alpha recovery research

on:
  push:
    branches: [research/alpha-recovery]
    paths:
      - '.github/workflows/alpha-recovery-research.yml'
      - 'artifacts/alpha-recovery/stock-confirmation/**'
      - 'uquant/portfolio/ordinary.py'
      - 'uquant/portfolio/pipeline.py'

permissions:
  contents: read

jobs:
  stock-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tests:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install pinned environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Stock confirmation regression
        run: |
          mkdir -p /tmp/alpha-recovery-results
          uv run --no-sync pytest artifacts/alpha-recovery/stock-confirmation/test_stock_confirmation.py --junitxml=/tmp/alpha-recovery-results/tests.xml
      - name: Retain test results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-recovery-tests-${{ github.sha }}
          path: /tmp/alpha-recovery-results
          if-no-files-found: warn
