name: Audit candidate transport

on:
  push:
    branches: [codex/audit-remediation-20260922]
    paths: [.github/workflows/audit-candidate.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Inspect recorder
        run: python -m tools.cloud_guard inspect
      - name: Install pinned tooling and portable interpreter
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/audit-runtime/python
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          python -m tools.cloud_guard run --name audit-runtime-python --timeout 240 -- uv python install 3.12.13
          python -m tools.cloud_guard run --name audit-runtime-dependencies --timeout 360 -- uv sync --frozen --extra dev --managed-python
      - name: Export runtime without credentials or account data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-runtime/site-packages"
          cp -a .venv/lib/python3.12/site-packages/. "$RUNNER_TEMP/audit-runtime/site-packages/"
          cp uv.lock "$RUNNER_TEMP/audit-runtime/uv.lock"
          python -m tools.cloud_guard run --name audit-runtime-archive --timeout 180 -- tar -C "$RUNNER_TEMP/audit-runtime" -czf "$RUNNER_TEMP/uquant-audit-runtime.tar.gz" python site-packages uv.lock
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'uquant-audit-runtime.tar.gz'
          with path.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          manifest = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'file': path.name, 'bytes': path.stat().st_size, 'sha256': digest,
              'uv_lock_sha256': hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest(),
              'python': '3.12.13',
          }
          (root / 'uquant-audit-runtime-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PY
          python -m tools.cloud_guard export --include-private-logs --output "$RUNNER_TEMP/audit-runtime-command.zip"
      - name: Preserve locked runtime and controlled command logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uquant-audit-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uquant-audit-runtime.tar.gz
            ${{ runner.temp }}/uquant-audit-runtime-manifest.json
            ${{ runner.temp }}/audit-runtime-command.zip
            ${{ runner.temp }}/audit-runtime-command.zip.receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
