name: Audit candidate transport

on:
  push:
    branches: [codex/audit-remediation-20260922]
    paths: [.github/workflows/audit-candidate.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Inspect recorder
        run: python -m tools.cloud_guard inspect
      - name: Export immutable Git objects
        run: >-
          python -m tools.cloud_guard run --name audit-source-export --timeout 300 --
          git bundle create "${{ runner.temp }}/uquant-candidate.bundle" HEAD
      - name: Record transport identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'uquant-candidate.bundle'
          with path.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          payload = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'file': path.name,
              'bytes': path.stat().st_size,
              'sha256': digest,
          }
          (root / 'uquant-candidate-manifest.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload))
          PY
          python -m tools.cloud_guard export --include-private-logs --output "$RUNNER_TEMP/audit-source-command.zip"
      - name: Preserve source and original transport logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uquant-audit-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uquant-candidate.bundle
            ${{ runner.temp }}/uquant-candidate-manifest.json
            ${{ runner.temp }}/audit-source-command.zip
            ${{ runner.temp }}/audit-source-command.zip.receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
