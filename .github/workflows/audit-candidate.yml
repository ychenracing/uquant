name: Audit candidate transport

on:
  push:
    branches: [codex/audit-remediation-20260922]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Inspect recorder and install locked tools
        run: |
          python -m tools.cloud_guard inspect
          python -m pip install --disable-pip-version-check uv==0.11.33
          python -m tools.cloud_guard run --name audit-readback-tools --timeout 360 -- uv sync --frozen --extra dev
      - name: Export new candidate objects and lint executable
        run: |
          python -m tools.cloud_guard run --name audit-incremental-objects --timeout 180 -- git bundle create "$RUNNER_TEMP/uquant-audit-incremental.bundle" HEAD ^2960eec7b727f329289ff8107d51be51e9463197
          cp .venv/bin/ruff "$RUNNER_TEMP/ruff"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          manifest = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'prerequisite': '2960eec7b727f329289ff8107d51be51e9463197',
              'uv_lock_sha256': hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest(),
              'files': [],
          }
          for name in ('uquant-audit-incremental.bundle', 'ruff'):
              path = root / name
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              manifest['files'].append({'path': name, 'bytes': path.stat().st_size, 'sha256': digest})
          (root / 'uquant-audit-readback.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PY
          python -m tools.cloud_guard export --include-private-logs --output "$RUNNER_TEMP/audit-readback-command.zip"
      - name: Preserve exact candidate readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uquant-audit-readback-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uquant-audit-incremental.bundle
            ${{ runner.temp }}/ruff
            ${{ runner.temp }}/uquant-audit-readback.json
            ${{ runner.temp }}/audit-readback-command.zip
            ${{ runner.temp }}/audit-readback-command.zip.receipt.json
          if-no-files-found: error
          retention-days: 30
