name: CI repair source snapshot

on:
  push:
    branches: [fix/ci-evidence-recovery-20260919]
    paths: [.github/workflows/ci-repair-diagnostics.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 237750e288350c8007a5619a06be22564fe39173
          persist-credentials: false
      - name: Preserve exact committed source for offline diagnosis
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/uquant-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 237750e288350c8007a5619a06be22564fe39173
          mkdir -p "$SNAPSHOT_DIR"
          git archive --format=tar HEAD | gzip -n > "$SNAPSHOT_DIR/source.tar.gz"
          git ls-tree -rz --full-tree HEAD > "$SNAPSHOT_DIR/git-files.bin"
          git cat-file commit HEAD > "$SNAPSHOT_DIR/commit.raw"
          git rev-parse HEAD HEAD^{tree} > "$SNAPSHOT_DIR/identity.txt"
          cd "$SNAPSHOT_DIR"
          sha256sum source.tar.gz git-files.bin commit.raw identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uquant-source-237750e-${{ github.run_id }}
          path: ${{ runner.temp }}/uquant-source/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
