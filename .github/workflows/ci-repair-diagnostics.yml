name: CI repair targeted verification

on:
  push:
    branches: [fix/ci-evidence-recovery-20260919]
    paths: [.github/workflows/ci-repair-diagnostics.yml]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4ccb1bfa1fb5aca0b5e2f9fbdb0ef31ad97d1b4b
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install the locked development environment
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --extra dev
      - name: Preserve published source before verification
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uquant-readback
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4ccb1bfa1fb5aca0b5e2f9fbdb0ef31ad97d1b4b
          mkdir -p "$OUTPUT_DIR"
          git archive HEAD uquant/validation/absolute_generalization/artifacts.py tests/test_absolute_generalization_entry_checks.py | gzip -n > "$OUTPUT_DIR/source.tar.gz"
          git cat-file commit HEAD > "$OUTPUT_DIR/commit.raw"
          git ls-tree -r HEAD uquant/validation/absolute_generalization/artifacts.py tests/test_absolute_generalization_entry_checks.py > "$OUTPUT_DIR/git-files.txt"
          cp .venv/bin/ruff "$OUTPUT_DIR/ruff"
          git rev-parse HEAD HEAD^{tree} > "$OUTPUT_DIR/identity.txt"
          uv run python -c 'import sys, numpy, pandas; print(sys.version); print(numpy.__version__); print(pandas.__version__)' > "$OUTPUT_DIR/runtime.txt"
      - name: Validate exact changed source and artifact regressions
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uquant-readback
        run: |
          set -euo pipefail
          uv run ruff check uquant/validation/absolute_generalization/artifacts.py tests/test_absolute_generalization_entry_checks.py | tee "$OUTPUT_DIR/lint.txt"
          uv run mypy uquant/validation/absolute_generalization/artifacts.py | tee "$OUTPUT_DIR/types.txt"
          uv run pytest tests/test_absolute_generalization_artifacts.py tests/test_absolute_generalization_entry_checks.py | tee "$OUTPUT_DIR/tests.txt"
      - name: Hash verification files
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/uquant-readback
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: uquant-readback-4ccb1bfa-${{ github.run_id }}
          path: ${{ runner.temp }}/uquant-readback/
          if-no-files-found: error
          retention-days: 30
