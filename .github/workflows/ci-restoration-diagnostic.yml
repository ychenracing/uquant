name: CI restoration diagnostic

on:
  push:
    branches: [fix/main-ci-restoration-20260919]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned source and object identities
        run: |
          mkdir -p "$RUNNER_TEMP/restoration"
          git archive --format=tar.gz --output="$RUNNER_TEMP/restoration/source.tar.gz" HEAD \
            AGENTS.md PROJECT_STATE.md .github uquant scripts research tests benchmarks data \
            docs README.md LICENSE pyproject.toml uv.lock setup.py requirements.txt MANIFEST.in .gitignore .gitattributes
          git ls-tree -r HEAD > "$RUNNER_TEMP/restoration/git-objects.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/restoration/head.commit"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'restoration'
          files = {}
          for path in sorted(root.iterdir()):
              with path.open('rb') as stream:
                  files[path.name] = {'bytes': path.stat().st_size, 'sha256': hashlib.file_digest(stream, 'sha256').hexdigest()}
          metadata = {'source_sha': os.environ['GITHUB_SHA'], 'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'files': files}
          (root / 'manifest.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-restoration-source-${{ github.sha }}
          path: ${{ runner.temp }}/restoration/
          if-no-files-found: error
          retention-days: 90
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Package runtime without credentials or caches
        run: |
          mkdir -p "$RUNNER_TEMP/locked-environment"
          runtime_root=$(python -c 'import sys; print(sys.base_prefix)')
          tar -czf "$RUNNER_TEMP/locked-environment/python.tar.gz" -C "$runtime_root" .
          tar --exclude='__pycache__' -czf "$RUNNER_TEMP/locked-environment/venv.tar.gz" .venv
          cp uv.lock "$RUNNER_TEMP/locked-environment/uv.lock"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'locked-environment'
          files = {}
          for path in sorted(root.iterdir()):
              with path.open('rb') as stream:
                  files[path.name] = {'bytes': path.stat().st_size, 'sha256': hashlib.file_digest(stream, 'sha256').hexdigest()}
          (root / 'manifest.json').write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA'], 'files': files}, indent=2) + '\n')
          print(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-restoration-locked-environment-${{ github.sha }}
          path: ${{ runner.temp }}/locked-environment/
          if-no-files-found: error
          retention-days: 90
