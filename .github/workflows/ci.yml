name: Engineering gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Strict typing
        run: uv run mypy uquant scripts research
      - name: Frozen-data integrity
        run: uv run python -m uquant.validation data-manifest --data-dir data/frozen
      - name: Future holdout contract and lane integrity
        run: uv run python -m scripts.future_holdout validate-static-lanes
      - name: Manual execution evidence contract
        run: |
          uv run python -m scripts.future_holdout journal verify
          uv run python -m scripts.production_observation --help
          git check-ignore -q --no-index future_holdout_execution_journal.jsonl
          git check-ignore -q --no-index future_holdout_execution_journal.checkpoint.json
          git check-ignore -q --no-index future_holdout_lane_report.json
          git check-ignore -q --no-index production_observation_backups/example/receipt.json
      - name: Shadow Sentinel contract and import isolation
        run: uv run python -m uquant.risk_sentinel --validate-contracts
      - name: Bytecode compilation
        run: uv run python -m compileall -q uquant scripts research tests
      - name: Build deterministic production wheel from committed source
        run: >-
          uv run --no-sync python -m scripts.build_reproducible_wheel
          --source-ref "${GITHUB_SHA}"
          --output-dir dist

  test_matrix:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard:
          - architecture-foundation
          - architecture-portfolio
          - architecture-remaining
          - application-left
          - application-right
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run deterministic test shard
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ignore_args=()
          case "$TEST_SHARD" in
            architecture-foundation)
              test_paths=(
                tests/architecture/test_architecture_governance.py
                tests/architecture/test_compatibility_contracts.py
              )
              ;;
            architecture-portfolio)
              test_paths=(
                tests/architecture/test_complexity_budgets.py
                tests/architecture/test_config_boundaries.py
                tests/architecture/test_config_public_owners.py
                tests/architecture/test_current_heads_transport.py
                tests/architecture/test_distribution_contracts.py
                tests/architecture/test_execution_application_boundaries.py
                tests/architecture/test_execution_risk_public_owners.py
                tests/architecture/test_import_contracts.py
                tests/architecture/test_market_boundaries.py
                tests/architecture/test_portfolio_boundaries.py
              )
              ;;
            architecture-remaining)
              test_paths=(tests/architecture)
              ignore_args=(
                --ignore=tests/architecture/test_architecture_governance.py
                --ignore=tests/architecture/test_compatibility_contracts.py
                --ignore=tests/architecture/test_complexity_budgets.py
                --ignore=tests/architecture/test_config_boundaries.py
                --ignore=tests/architecture/test_config_public_owners.py
                --ignore=tests/architecture/test_current_heads_transport.py
                --ignore=tests/architecture/test_distribution_contracts.py
                --ignore=tests/architecture/test_execution_application_boundaries.py
                --ignore=tests/architecture/test_execution_risk_public_owners.py
                --ignore=tests/architecture/test_import_contracts.py
                --ignore=tests/architecture/test_market_boundaries.py
                --ignore=tests/architecture/test_portfolio_boundaries.py
              )
              ;;
            application-left)
              test_paths=(tests/test_[a-m]*.py)
              ;;
            application-right)
              test_paths=(tests/test_[n-z]*.py)
              ;;
            *)
              echo "Unknown test shard: $TEST_SHARD" >&2
              exit 2
              ;;
          esac
          coverage_args=()
          if [[ "$TEST_SHARD" == application-* ]]; then
            coverage_args=(--cov=uquant --cov-report= --cov-fail-under=0)
          fi
          if [[ "$TEST_SHARD" == "architecture-portfolio" ]]; then
            # The immutable allocation oracle is byte-exact.  Pin its numeric
            # dispatch to the oldest common x86-64 kernel so GitHub runner
            # region changes cannot select a different last-bit reduction.
            export OPENBLAS_CORETYPE=Nehalem
            export OPENBLAS_NUM_THREADS=1
            export OMP_NUM_THREADS=1
            export NPY_DISABLE_CPU_FEATURES=AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,AVX,FMA3,F16C
          fi
          uv run pytest "${test_paths[@]}" "${ignore_args[@]}" \
            "${coverage_args[@]}"
      - name: Upload shard coverage
        if: ${{ always() && startsWith(matrix.shard, 'application-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-coverage-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Combined branch coverage
    needs: [test_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: engineering-coverage-${{ github.run_id }}-attempt-${{ github.run_attempt }}-application-*
          path: ${{ runner.temp }}/coverage-parts
          merge-multiple: true
      - name: Require combined branch coverage
        run: |
          uv run coverage combine "$RUNNER_TEMP/coverage-parts"
          uv run coverage report --show-missing --fail-under=85
          uv run coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: coverage.xml

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Resolve Bandit comparison base
        id: bandit-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Bandit comparison base is not a full Git SHA: $base_sha" >&2
            exit 2
          fi
          git cat-file -e "${base_sha}^{commit}"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Run differential static security scan
        env:
          BASE_SHA: ${{ steps.bandit-base.outputs.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/uquant-bandit-base"
          baseline_report="$RUNNER_TEMP/uquant-bandit-baseline.json"
          candidate_report="$RUNNER_TEMP/uquant-bandit-candidate.json"
          git worktree add --detach "$base_root" "$BASE_SHA"
          trap 'git worktree remove --force "$base_root"' EXIT

          set +e
          uv run bandit -q -f json -o "$baseline_report" -r "$base_root/uquant" "$base_root/research" "$base_root/scripts"
          baseline_status=$?
          uv run bandit -q -f json -o "$candidate_report" -r uquant research scripts
          candidate_status=$?
          set -e
          if [ "$baseline_status" -gt 1 ] || [ "$candidate_status" -gt 1 ]; then
            echo "Bandit scan failed: baseline=$baseline_status candidate=$candidate_status" >&2
            exit 2
          fi

          uv run python .github/scripts/bandit_differential.py \
            --baseline-report "$baseline_report" \
            --baseline-root "$base_root" \
            --candidate-report "$candidate_report" \
            --candidate-root "$GITHUB_WORKSPACE"
      - name: Export production dependency lock
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/uquant-requirements.txt
      - name: Audit production dependencies
        run: >-
          uv run pip-audit
          --cache-dir /tmp/uquant-pip-audit-cache
          --requirement /tmp/uquant-requirements.txt

  windows_smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12.13 has no Windows artifact in actions/python-versions.
          python-version: "3.12.10"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${env:UV_VERSION}"
      - name: Sync locked production environment
        run: uv sync --frozen
      - name: Native Windows imports, CLIs, journal, and lock contention
        run: uv run --no-sync python tests/windows_ci_smoke.py

  engineering:
    name: Engineering
    if: ${{ always() }}
    needs: [quality, test_matrix, coverage, security, windows_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality, security, and Windows smoke
        run: |
          quality='${{ needs.quality.result }}'
          test_matrix='${{ needs.test_matrix.result }}'
          coverage='${{ needs.coverage.result }}'
          security='${{ needs.security.result }}'
          windows_smoke='${{ needs.windows_smoke.result }}'
          if [ "$quality" != "success" ] || [ "$test_matrix" != "success" ] || [ "$coverage" != "success" ] || [ "$security" != "success" ] || [ "$windows_smoke" != "success" ]; then
            echo "Engineering failed: quality=$quality test_matrix=$test_matrix coverage=$coverage security=$security windows_smoke=$windows_smoke"
            exit 1
          fi
