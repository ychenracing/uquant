name: Engineering gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Strict typing
        run: uv run mypy uquant scripts research
      - name: Frozen-data integrity
        run: uv run python -m uquant.validation data-manifest --data-dir data/frozen
      - name: Future holdout contract and lane integrity
        run: uv run python scripts/future_holdout.py validate-lanes
      - name: Shadow Sentinel contract and import isolation
        run: uv run python -m uquant.risk_sentinel --validate-contracts
      - name: Tests and branch coverage
        run: uv run pytest --cov=uquant --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Bytecode compilation
        run: uv run python -m compileall -q uquant scripts research tests
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: coverage.xml

  security:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Static security scan
        run: uv run bandit -q -r uquant research scripts
      - name: Export production dependency lock
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/uquant-requirements.txt
      - name: Audit production dependencies
        run: >-
          uv run pip-audit
          --cache-dir /tmp/uquant-pip-audit-cache
          --requirement /tmp/uquant-requirements.txt

  engineering:
    name: Engineering
    if: ${{ always() }}
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality and security
        run: |
          quality='${{ needs.quality.result }}'
          security='${{ needs.security.result }}'
          if [ "$quality" != "success" ] || [ "$security" != "success" ]; then
            echo "Engineering failed: quality=$quality security=$security"
            exit 1
          fi
