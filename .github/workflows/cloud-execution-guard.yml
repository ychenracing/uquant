name: Cloud execution guard

on:
  push:
    branches: [main, codex/cloud-execution-continuity]
    paths:
      - tools/cloud_guard/**
      - AGENTS.md
      - .gitignore
      - .github/workflows/cloud-execution-guard.yml
      - .github/workflows/absolute-generalization-acceptance.yml
      - .github/workflows/strategic-ownership-acceptance.yml
  pull_request:
    paths:
      - tools/cloud_guard/**
      - AGENTS.md
      - .gitignore
      - .github/workflows/*
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Cloud recorder and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install locked development tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Lint guard
        run: >-
          python -m tools.cloud_guard --root "$RUNNER_TEMP/cloud-task-journal"
          run --name cloud-guard-lint --timeout 120 --heartbeat 2 --
          uv run ruff check tools/cloud_guard
      - name: Execute bounded fault-injection checks
        if: ${{ always() }}
        run: >-
          python -m tools.cloud_guard --root "$RUNNER_TEMP/cloud-task-journal"
          run --name cloud-guard-tests --timeout 240 --heartbeat 2 --
          python -m unittest discover -s tools/cloud_guard/tests -v
      - name: Export controlled test and lint originals with exact source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.cloud_guard --root "$RUNNER_TEMP/cloud-task-journal" export \
            --include-private-logs --output "$RUNNER_TEMP/cloud-guard-checks.zip"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          paths = subprocess.check_output([
              "git", "ls-files", "-z", "tools/cloud_guard", "AGENTS.md", ".gitignore",
              ".github/workflows/cloud-execution-guard.yml",
              ".github/workflows/absolute-generalization-acceptance.yml",
              ".github/workflows/strategic-ownership-acceptance.yml",
          ]).split(b"\0")
          output = Path(os.environ["RUNNER_TEMP"])
          manifest = {"schema": 1, "commit": subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip(), "files": []}
          with zipfile.ZipFile(output / "cloud-guard-source.zip", "w", zipfile.ZIP_DEFLATED) as bundle:
              for item in paths:
                  if not item:
                      continue
                  path = item.decode()
                  data = subprocess.check_output(["git", "show", "HEAD:" + path])
                  if data != Path(path).read_bytes():
                      raise ValueError("tested worktree differs from committed source: " + path)
                  oid = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
                  if hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() != oid:
                      raise ValueError("Git blob identity mismatch: " + path)
                  bundle.writestr(path, data)
                  manifest["files"].append({"path": path, "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(), "git_blob_sha": oid})
          with zipfile.ZipFile(output / "cloud-guard-source.zip") as bundle:
              for row in manifest["files"]:
                  if bundle.read(row["path"]) != Path(row["path"]).read_bytes():
                      raise ValueError("source archive differs from tested bytes: " + row["path"])
          (output / "cloud-guard-source-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Preserve recorder test originals and source for remote readback
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-guard-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-guard-checks.zip
            ${{ runner.temp }}/cloud-guard-checks.zip.receipt.json
            ${{ runner.temp }}/cloud-guard-source.zip
            ${{ runner.temp }}/cloud-guard-source-manifest.json
          if-no-files-found: error
          retention-days: 30
