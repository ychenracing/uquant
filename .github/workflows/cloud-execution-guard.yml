name: Cloud execution guard

on:
  push:
    branches: [main, codex/cloud-execution-continuity]
    paths:
      - tools/cloud_guard/**
      - AGENTS.md
      - .gitignore
      - .github/workflows/cloud-execution-guard.yml
      - .github/workflows/absolute-generalization-acceptance.yml
      - .github/workflows/strategic-ownership-acceptance.yml
  pull_request:
    paths:
      - tools/cloud_guard/**
      - AGENTS.md
      - .gitignore
      - .github/workflows/*
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Cloud recorder and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install locked development tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Lint guard
        run: uv run ruff check tools/cloud_guard
      - name: Execute bounded fault-injection checks
        if: ${{ always() }}
        run: >-
          python -m tools.cloud_guard --root "$RUNNER_TEMP/cloud-task-journal"
          run --name cloud-guard-tests --timeout 240 --heartbeat 2 --
          python -m unittest discover -s tools/cloud_guard/tests -v
      - name: Export non-sensitive test evidence and exact source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.cloud_guard --root "$RUNNER_TEMP/cloud-task-journal" export \
            --include-private-logs --output "$RUNNER_TEMP/cloud-guard-checks.zip"
          python - <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          paths = subprocess.check_output([
              "git", "ls-files", "-z", "tools/cloud_guard", "AGENTS.md", ".gitignore",
              ".github/workflows/cloud-execution-guard.yml",
              ".github/workflows/absolute-generalization-acceptance.yml",
              ".github/workflows/strategic-ownership-acceptance.yml",
          ]).split(b"\0")
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "cloud-guard-source.zip",
                               "w", zipfile.ZIP_DEFLATED) as bundle:
              for item in paths:
                  if item:
                      path = item.decode()
                      bundle.writestr(path, subprocess.check_output(["git", "show", "HEAD:" + path]))
          PY
      - name: Preserve recorder test originals and source for remote readback
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-guard-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-guard-checks.zip
            ${{ runner.temp }}/cloud-guard-checks.zip.receipt.json
            ${{ runner.temp }}/cloud-guard-source.zip
          if-no-files-found: error
          retention-days: 30
