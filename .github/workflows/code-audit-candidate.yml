name: Code audit candidate
on:
  push:
    branches: [codex/code-audit-fixes-20260922]
    paths:
      - .github/workflows/code-audit-candidate.yml
      - artifacts/code-audit-fix/*.py
      - artifacts/code-audit-fix/patches/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: code-audit-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/codex/code-audit-fixes-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/code-audit-fixes-20260922
      AUDIT_BASE: 7bc5cd5e20038c94ab5cf556ce107104692236ac
      UV_VERSION: '0.11.33'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Inspect published cloud recorder and applicable instructions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          python -m tools.cloud_guard inspect
          python artifacts/code-audit-fix/inspect_candidate.py
      - name: Apply reviewed candidate repairs
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          if test -f artifacts/code-audit-fix/apply_fixes.py; then
            python -m tools.cloud_guard run --name audit-apply --timeout 300 -- python artifacts/code-audit-fix/apply_fixes.py
          fi
      - name: Verify affected paths
        id: verify
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if test -f artifacts/code-audit-fix/verify_candidate.py; then
            python -m pip install --disable-pip-version-check "uv==$UV_VERSION"
            python -m tools.cloud_guard run --name audit-environment --timeout 600 -- uv sync --frozen --extra dev
            python -m tools.cloud_guard run --name audit-verification --timeout 1200 -- uv run --no-sync python artifacts/code-audit-fix/verify_candidate.py
          fi
      - name: Preserve candidate files and verify remote bytes
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          remote=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Candidate changed concurrently; refusing to push.'; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/code-audit-fix/RUN_STATUS.json')
          p.write_text(json.dumps({k:os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','APPLY_OUTCOME','VERIFY_OUTCOME')},indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uquant tests docs artifacts/code-audit-fix
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve scoped audit candidate and verification evidence'
            python -m tools.cloud_guard run --name audit-publish --timeout 120 -- git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          ref='refs/remotes/origin/'+os.environ['TARGET_BRANCH']
          head=git('rev-parse','HEAD').decode().strip()
          assert git('rev-parse',ref).decode().strip()==head
          paths=git('diff','--name-only','--diff-filter=ACMRT',os.environ['AUDIT_BASE'],'HEAD').decode().splitlines()
          rows=[]
          for name in paths:
              local=Path(name).read_bytes()
              remote=git('show',ref+':'+name)
              assert remote==local, name
              oid=hashlib.sha1(b'blob '+str(len(local)).encode()+b'\0'+local).hexdigest()
              assert git('rev-parse',ref+':'+name).decode().strip()==oid
              rows.append({'path':name,'bytes':len(local),'sha256':hashlib.sha256(local).hexdigest(),'git_blob':oid})
          Path('artifacts/code-audit-fix/REMOTE_READBACK.json').write_text(json.dumps({'commit':head,'verified':True,'files':rows},indent=2)+'\n')
          print(json.dumps({'verified_commit':head,'byte_verified_files':len(rows)}))
          PY
          git add artifacts/code-audit-fix/REMOTE_READBACK.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: retain candidate remote byte-verification receipt'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git show "refs/remotes/origin/$TARGET_BRANCH:artifacts/code-audit-fix/REMOTE_READBACK.json" | cmp - artifacts/code-audit-fix/REMOTE_READBACK.json
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)"
      - name: Preserve failure status
        if: always()
        run: |
          test '${{ steps.apply.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
