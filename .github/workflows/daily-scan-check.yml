name: Daily observer verification
on:
  pull_request:
    paths:
      - scripts/daily_scan*.py
      - tests/test_daily_scan.py
      - .github/workflows/daily-scan-check.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ychenracing/uquant' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Locked tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --extra dev
      - name: Observer tests, including the real production engine
        run: >-
          python -m tools.cloud_guard --root "$RUNNER_TEMP/daily-journal"
          run --name daily-observer-tests --timeout 420 --
          uv run pytest tests/test_daily_scan.py
      - name: Focused lint
        if: ${{ always() }}
        run: >-
          python -m tools.cloud_guard --root "$RUNNER_TEMP/daily-journal"
          run --name daily-observer-lint --timeout 60 --
          uv run ruff check scripts/daily_scan.py scripts/daily_scan_market.py
          scripts/daily_scan_report.py scripts/daily_scan_store.py tests/test_daily_scan.py
      - name: Preserve exact source and test originals privately
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/daily-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/daily-evidence/source-sha.txt"
          git archive --format=tar HEAD scripts/daily_scan.py scripts/daily_scan_market.py \
            scripts/daily_scan_report.py scripts/daily_scan_store.py tests/test_daily_scan.py \
            docs/DAILY_SCAN.md .github/workflows/daily-scan-check.yml \
            > "$RUNNER_TEMP/daily-evidence/source.tar"
          python -m tools.cloud_guard --root "$RUNNER_TEMP/daily-journal" export \
            --include-private-logs --output "$RUNNER_TEMP/daily-evidence/checks.zip"
          cd "$RUNNER_TEMP/daily-evidence" && sha256sum source.tar checks.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: daily-observer-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-evidence
          if-no-files-found: error
          retention-days: 30
