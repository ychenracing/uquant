name: Generalization Tradeoff Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  public-evidence:
    name: Public evidence (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: loo-0
            stage: loo
            only: loo-sh600487,loo-sh688019,loo-sh688120,loo-sh688300,loo-sz002281,loo-sz300394
          - name: loo-1
            stage: loo
            only: loo-sh601869,loo-sh688037,loo-sh688146,loo-sh688347,loo-sz002371,loo-sz300502
          - name: loo-2
            stage: loo
            only: loo-sh603688,loo-sh688041,loo-sh688200,loo-sh688361,loo-sz002409,loo-sz300604
          - name: loo-3
            stage: loo
            only: loo-sh603986,loo-sh688072,loo-sh688233,loo-sh688498,loo-sz300054,loo-sz300666
          - name: loo-4
            stage: loo
            only: loo-sh688008,loo-sh688082,loo-sh688256,loo-sh688766,loo-sz300223
          - name: loo-5
            stage: loo
            only: loo-sh688012,loo-sh688110,loo-sh688268,loo-sz000636,loo-sz300308
          - name: stress-full
            stage: stress
            only: full-offset0,full-offset5,full-offset10,full-cost2
          - name: stress-remove308
            stage: stress
            only: remove308-offset0,remove308-offset5,remove308-offset10,remove308-cost2
          - name: stress-remove502
            stage: stress
            only: remove502-offset0,remove502-offset5,remove502-offset10,remove502-cost2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install canonical runtime
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen
          uv run python - <<'PYCODE'
          import numpy
          import pandas

          assert numpy.__version__ == "2.5.1"
          assert pandas.__version__ == "3.0.5"
          PYCODE
      - name: Prepare frozen historical checkout
        run: |
          historical_source="$(python - <<'PYCODE'
          import json

          with open("benchmarks/generalization_tradeoff_acceptance.json", encoding="utf-8") as stream:
              print(json.load(stream)["historical_source"])
          PYCODE
          )"
          historical_root="$(dirname "$GITHUB_WORKSPACE")/uquant-historical"
          git worktree add --detach "$historical_root" "$historical_source"
          test "$(git -C "$historical_root" rev-parse HEAD)" = "$historical_source"
      - name: Run bounded public evidence cells
        env:
          JOB_NAME: ${{ matrix.name }}
          ONLY_CELLS: ${{ matrix.only }}
          STAGE: ${{ matrix.stage }}
        run: |
          set -o pipefail
          output_root="$RUNNER_TEMP/generalization-tradeoff"
          mkdir -p "$output_root/metadata"
          uv run python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output_root = Path(os.environ["RUNNER_TEMP"]) / "generalization-tradeoff"
          cells = os.environ["ONLY_CELLS"].split(",")
          roles = ("candidate", "historical") if os.environ["STAGE"] == "loo" else ("candidate",)
          expected = [f"{role}/{case}.json.gz" for role in roles for case in cells]
          metadata = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job_name": os.environ["JOB_NAME"],
              "stage": os.environ["STAGE"],
              "expected_files": expected,
          }
          (output_root / "metadata" / "job.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYCODE
          uv run python artifacts/alpha-recovery/generalization-tradeoff/run_batch.py \
            --stage "$STAGE" \
            --workers 2 \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-label candidate \
            --runs-root "$output_root" \
            --only "$ONLY_CELLS" \
            2>&1 | tee "$output_root/metadata/batch.log"
          uv run python - <<'PYCODE'
          import gzip
          import json
          import os
          from pathlib import Path

          output_root = Path(os.environ["RUNNER_TEMP"]) / "generalization-tradeoff"
          cells = os.environ["ONLY_CELLS"].split(",")
          roles = ("candidate", "historical") if os.environ["STAGE"] == "loo" else ("candidate",)
          for role in roles:
              for case in cells:
                  path = output_root / role / f"{case}.json.gz"
                  if not path.is_file():
                      raise SystemExit(f"missing output: {path}")
                  with gzip.open(path, "rt", encoding="utf-8") as stream:
                      artifact = json.load(stream)
                  if artifact.get("case") != case or artifact.get("completed") is not True:
                      raise SystemExit(f"invalid or incomplete output: {path}")
          PYCODE
      - name: Upload original evidence and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generalization-tradeoff-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ runner.temp }}/generalization-tradeoff
          if-no-files-found: error
