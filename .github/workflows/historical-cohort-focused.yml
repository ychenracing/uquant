name: Historical cohort focused checks

on:
  push:
    branches: [codex/historical-cohort-replay-20260909]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.33"
      - run: uv sync --frozen --extra dev
      - name: Cohort and data isolation tests
        run: uv run pytest tests/test_research_cohort_input.py tests/test_research_data_binding.py -q
      - name: Affected lint
        run: uv run ruff check uquant/contracts/universe.py uquant/leader.py tests/test_research_cohort_input.py
      - name: Affected typing
        run: uv run mypy uquant/contracts/universe.py uquant/leader.py
