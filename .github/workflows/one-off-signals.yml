name: One-off 13-stock closing signals
on:
  push:
    branches: [codex/signal-scan-20260918-13-uquant]
    paths: [.github/workflows/one-off-signals.yml]
permissions:
  contents: read
concurrency:
  group: uquant-13-stock-closing-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 57c63bc3840d74876a37f55ea4b712b6fd96ccd4
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --no-dev
      - name: Reuse verified fetch harness and capture consecutive decisions
        run: |
          git fetch --depth=1 origin b2ae52a48ead2e8c26154bb1b9fdef0947c39b57
          python - <<'PYTHON'
          import ast, hashlib, json, pathlib, re, subprocess, textwrap
          root = pathlib.Path('scan-output')
          root.mkdir(exist_ok=True)
          legacy = subprocess.check_output(['git', 'show', 'b2ae52a48ead2e8c26154bb1b9fdef0947c39b57:.github/workflows/one-off-signals.yml'])
          assert hashlib.sha1(b'blob '+str(len(legacy)).encode()+b'\0'+legacy).hexdigest() == '8a3664998ac1264e0883fc0ef87949a737f23d64'
          (root/'legacy-harness-workflow.yml').write_bytes(legacy)
          script = textwrap.dedent(legacy.decode().split("cat > /tmp/uquant_scan.py <<'PYTHON'\n", 1)[1].split('          PYTHON\n', 1)[0])
          script = script.replace("DATE = '2026-09-18'", "DATE = '2026-09-22'")
          script = script.replace("SOURCE = 'b4850f1eac2df8872672277612fbc71ef6130740'", "SOURCE = '57c63bc3840d74876a37f55ea4b712b6fd96ccd4'")
          assert script.count('engine=ProductionEngine(DATA)\n') == 1
          script = script.split('engine=ProductionEngine(DATA)\n', 1)[0]
          metadata = "metadata = {'source_commit': SOURCE, 'source_fingerprint': code_fingerprint(), 'as_of': DATE, 'python': platform.python_version(), 'symbols': SYMBOLS, 'mode': 'historical_simulation_not_live_account', 'initial_cash': 2000000, 'replay_start': '2026-01-05', 'comparison': 'same_current_source_and_continuous_account', 'formal_holdout': False}"
          script, count = re.subn(r'^metadata = .*$', lambda _: metadata, script, flags=re.MULTILINE)
          assert count == 1
          script += '''
          quote_path = ROOT/'quotes.json'
          if not quote_path.exists():
              raise RuntimeError('Current quote timestamp cross-check unavailable')
          quotes = json.loads(quote_path.read_text())
          manifest_by_symbol = {row['symbol']: row for row in results}
          for symbol in SYMBOLS:
              quote = quotes.get(symbol, {})
              if str(quote.get('timestamp', ''))[:8] != DATE.replace('-', ''):
                  raise RuntimeError(f'Quote timestamp does not match requested session: {symbol}')
              history_close = manifest_by_symbol[symbol]['close']
              if abs(float(quote['close'])-history_close) > max(0.011, abs(history_close)*0.0001):
                  raise RuntimeError(f'Quote/history close mismatch: {symbol}')
          sessions = None
          for symbol in INDEX_SYMBOLS:
              dates = set(pd.read_csv(DATA/f'{symbol}.csv')['date'].astype(str))
              sessions = dates if sessions is None else sessions & dates
          previous = max(day for day in sessions if day < DATE)
          requested_dates = (previous, DATE)
          metadata['previous_session'] = previous
          metadata['amount_estimated_symbols'] = [row['symbol'] for row in results if row.get('amount_estimated')]
          metadata['price_crosscheck'] = 'all_13_current_quote_dates_and_closes_verified'
          write_json(ROOT/'metadata.json', metadata)
          captures = {}

          class ReportingEngine(ProductionEngine):
              def decide(self, **kwargs):
                  decision = super().decide(**kwargs)
                  date = kwargs['as_of']
                  if date in requested_dates:
                      account = kwargs['account']
                      directory = ROOT/date
                      directory.mkdir(exist_ok=True)
                      write_json(directory/'decision.json', dataclasses.asdict(decision))
                      write_json(directory/'account_at_decision.json', account.to_dict())
                      report = render_daily_report(decision, account)
                      (directory/'report.md').write_text(report, encoding='utf-8')
                      (directory/'report.html').write_text(render_daily_html(decision, account), encoding='utf-8')
                      captures[date] = {'date': date, 'opportunity': decision.opportunity.value, 'risk': decision.risk.value, 'target_gross': decision.target_gross, 'decision_digest': decision.decision_digest, 'targets': [dataclasses.asdict(item) for item in decision.targets], 'pending_orders': [dataclasses.asdict(item) for item in decision.pending_orders], 'risk_summary': decision.risk_summary}
                      print('CAPTURED', date, decision.opportunity.value, decision.risk.value, decision.target_gross, flush=True)
                  return decision

          replay = ReportingEngine(DATA).backtest(symbols=SYMBOLS, start='2026-01-05', end=DATE, initial_cash=2000000)
          write_json(ROOT/'replay_full.json', replay)
          if replay['end'] != DATE or set(captures) != set(requested_dates):
              raise RuntimeError('Replay did not capture both required sessions')
          if code_fingerprint() != metadata['source_fingerprint']:
              raise RuntimeError('Production source changed during run')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'uquant', 'pyproject.toml', 'uv.lock'], check=True)
          write_json(ROOT/'signals-summary.json', {'metadata': metadata, 'quotes': quotes, 'sessions': captures})
          print('COMPLETE', DATE, 'previous_session', previous, 'symbols', len(SYMBOLS), flush=True)
          '''
          script = textwrap.dedent(script)
          ast.parse(script)
          pathlib.Path('/tmp/uquant_scan.py').write_text(script, encoding='utf-8')
          (root/'executed-harness.py').write_text(script, encoding='utf-8')
          print('Prepared unchanged production source with two-session read-only reporting')
          PYTHON
      - name: Fetch verified closing histories and run production decisions
        run: |
          python -m tools.cloud_guard inspect
          python -m tools.cloud_guard run --name close-scan-20260922 --timeout 660 -- uv run --no-sync python -u /tmp/uquant_scan.py
      - name: Preserve result bytes and manifests
        if: always()
        run: |
          mkdir -p scan-output
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/workflows/one-off-signals.yml" > scan-output/harness-workflow.yml
          git archive --format=tar -o scan-output/production-source.tar HEAD uquant pyproject.toml uv.lock tools/cloud_guard
          python - <<'PYTHON'
          import pathlib, hashlib, json
          root=pathlib.Path('scan-output')
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'FILE_MANIFEST.json').write_text(json.dumps(files,sort_keys=True,indent=2))
          print('PRESERVED_FILES',len(files))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uquant-closing-signals-20260922-13-${{ github.run_id }}
          path: |
            scan-output/
            .cloud-task-journal/
          include-hidden-files: true
          retention-days: 30
