name: One-off 13-stock closing signals
on:
  push:
    branches: [codex/signal-scan-20260918-13-uquant]
    paths: [.github/workflows/one-off-signals.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b4850f1eac2df8872672277612fbc71ef6130740
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen --no-dev
      - name: Prepare read-only report harness
        run: |
          cat > /tmp/uquant_scan.py <<'PYTHON'
          """One-off read-only report harness; strategy code is imported unchanged."""
          from __future__ import annotations
          import concurrent.futures, dataclasses, hashlib, json, os, pathlib, platform, subprocess, sys, traceback, urllib.parse, urllib.request
          import pandas as pd
          from uquant.data import DataStore
          from uquant.engine import ProductionEngine, REFERENCE_UNIVERSE, INDEX_SYMBOLS, code_fingerprint
          from uquant.types import AccountState
          from uquant.report import render_daily_report, render_daily_html
          
          DATE = '2026-09-18'
          SOURCE = 'b4850f1eac2df8872672277612fbc71ef6130740'
          SYMBOLS = ['sz300308','sz300502','sz300394','sh688256','sh603986','sh688072','sh688300','sz300054','sh688361','sz002409','sh688498','sh688120','sz002384']
          ROOT = pathlib.Path('scan-output'); DATA = ROOT/'data'; RAW = ROOT/'raw'
          for p in (ROOT, DATA, RAW): p.mkdir(parents=True, exist_ok=True)
          
          def write_json(path, obj):
              pathlib.Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0', 'Referer':'https://finance.qq.com/'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read()
          
          def download(symbol):
              errors = []
              for provider in ('eastmoney', 'tencent'):
                  try:
                      if provider == 'eastmoney':
                          params = {'secid':('1.' if symbol.startswith('sh') else '0.')+symbol[2:], 'klt':'101', 'fqt':'0' if symbol in INDEX_SYMBOLS else '1', 'beg':'20220101', 'end':DATE.replace('-',''), 'lmt':'2000', 'fields1':'f1,f2,f3,f4,f5,f6', 'fields2':'f51,f52,f53,f54,f55,f56,f57'}
                          url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?'+urllib.parse.urlencode(params)
                          body = get(url); (RAW/f'{symbol}.{provider}.json').write_bytes(body)
                          payload = json.loads(body); rows = (payload.get('data') or {}).get('klines', [])
                          frame = pd.DataFrame([r.split(',')[:7] for r in rows], columns=['date','open','close','high','low','volume','amount'])
                          estimated = False
                      else:
                          param = f'{symbol},day,2022-01-01,{DATE},2000,' + ('' if symbol in INDEX_SYMBOLS else 'qfq')
                          url = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?'+urllib.parse.urlencode({'param':param})
                          body = get(url); (RAW/f'{symbol}.{provider}.json').write_bytes(body)
                          payload = json.loads(body); panel = payload.get('data',{}).get(symbol,{})
                          rows = panel.get('day',[]) if symbol in INDEX_SYMBOLS else panel.get('qfqday',[])
                          if not rows: raise ValueError('No rows in the requested adjustment basis')
                          frame = pd.DataFrame([r[:6] for r in rows], columns=['date','open','close','high','low','volume'])
                          estimated = True
                      if frame.empty: raise ValueError('Empty provider history')
                      for col in frame.columns:
                          if col != 'date': frame[col] = pd.to_numeric(frame[col], errors='raise')
                      frame['volume'] *= 100
                      frame = frame[frame['date'] <= DATE].sort_values('date').reset_index(drop=True)
                      validated = DataStore._validate(frame, symbol)
                      last = str(validated.index[-1].date())
                      if last != DATE: raise ValueError(f'Stale series: {last}, expected {DATE}')
                      if len(validated) < 320: raise ValueError(f'Insufficient history: {len(validated)} rows')
                      path = DATA/f'{symbol}.csv'; validated.reset_index().to_csv(path, index=False)
                      return {'symbol':symbol, 'status':'OK', 'provider':provider, 'url':url, 'rows':len(validated), 'first':str(validated.index[0].date()), 'last':last, 'close':float(validated.iloc[-1]['close']), 'change_pct':float((validated.iloc[-1]['close']/validated.iloc[-2]['close']-1)*100), 'amount_estimated':estimated, 'csv_sha256':hashlib.sha256(path.read_bytes()).hexdigest(), 'provider_errors':errors}
                  except Exception as exc:
                      errors.append(f'{provider}: {type(exc).__name__}: {exc}')
              return {'symbol':symbol, 'status':'FAILED', 'errors':errors}
          
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == SOURCE
          metadata = {'source_commit':SOURCE,'source_fingerprint':code_fingerprint(),'as_of':DATE,'python':platform.python_version(),'symbols':SYMBOLS,'assumptions':{'fresh':'Hypothetical CNY 2,000,000 cash account initialized on the signal date; no actual holdings supplied.','replay':'Hypothetical CNY 2,000,000 account replayed from 2026-01-05, using unchanged production defaults and next-open execution. Not a live account or a formal holdout.'}}
          write_json(ROOT/'metadata.json',metadata)
          required = sorted(set(REFERENCE_UNIVERSE)|set(INDEX_SYMBOLS)|set(SYMBOLS))
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for item in pool.map(download, required):
                  results.append(item); print('DATA', item['symbol'],item['status'],item.get('last'),item.get('close'), flush=True)
          write_json(ROOT/'data_manifest.json',results)
          try:
              body=get('https://qt.gtimg.cn/q='+','.join(SYMBOLS)); (RAW/'quotes.txt').write_bytes(body)
              quotes={}
              for line in body.decode('gbk').split(';'):
                  if '~' not in line: continue
                  prefix, data=line.strip().split('=',1); f=data.strip().strip('"').split('~'); symbol=prefix.removeprefix('v_')
                  quotes[symbol]={'name':f[1],'close':float(f[3]),'previous_close':float(f[4]),'timestamp':f[30],'change_pct':float(f[32])}
              write_json(ROOT/'quotes.json',quotes)
              print('QUOTE_DATES', {s:q['timestamp'] for s,q in quotes.items()},flush=True)
          except Exception as exc: write_json(ROOT/'quotes_error.json',{'error':str(exc)})
          failed=[r for r in results if r['status']!='OK']
          if failed:
              write_json(ROOT/'blocked.json',{'status':'DATA_BLOCKED','failed':failed})
              raise RuntimeError('Missing or stale required production inputs; no signals fabricated')
          
          engine=ProductionEngine(DATA)
          fresh=AccountState.empty(2000000)
          decision=engine.decide(symbols=SYMBOLS,as_of=DATE,account=fresh)
          write_json(ROOT/'fresh_decision.json',dataclasses.asdict(decision))
          write_json(ROOT/'fresh_account.json',fresh.to_dict())
          (ROOT/'fresh_report.md').write_text(render_daily_report(decision,fresh),encoding='utf-8')
          (ROOT/'fresh_report.html').write_text(render_daily_html(decision,fresh),encoding='utf-8')
          print('FRESH_REPORT_BEGIN\n'+render_daily_report(decision,fresh)+'\nFRESH_REPORT_END',flush=True)
          
          class ReportingEngine(ProductionEngine):
              def decide(self, **kwargs):
                  result=super().decide(**kwargs)
                  if kwargs['as_of'] == DATE:
                      account=kwargs['account']
                      write_json(ROOT/'replay_decision.json',dataclasses.asdict(result))
                      write_json(ROOT/'replay_account_at_decision.json',account.to_dict())
                      (ROOT/'replay_report.md').write_text(render_daily_report(result,account),encoding='utf-8')
                      (ROOT/'replay_report.html').write_text(render_daily_html(result,account),encoding='utf-8')
                      print('REPLAY_REPORT_BEGIN\n'+render_daily_report(result,account)+'\nREPLAY_REPORT_END',flush=True)
                  return result
          
          replay=ReportingEngine(DATA).backtest(symbols=SYMBOLS,start='2026-01-05',end=DATE,initial_cash=2000000)
          write_json(ROOT/'replay_full.json',replay)
          assert replay['end']==DATE
          assert (ROOT/'replay_decision.json').exists()
          print('COMPLETE',DATE,len(SYMBOLS),flush=True)
          PYTHON
      - name: Fetch verified closing histories and run production decisions
        run: |
          python -m tools.cloud_guard inspect
          python -m tools.cloud_guard run --name close-scan-20260918 --timeout 660 -- uv run --no-sync python -u /tmp/uquant_scan.py
      - name: Preserve result bytes and manifests
        if: always()
        run: |
          mkdir -p scan-output
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/workflows/one-off-signals.yml" > scan-output/harness-workflow.yml
          git archive --format=tar -o scan-output/production-source.tar HEAD uquant pyproject.toml uv.lock tools/cloud_guard
          python - <<'PYTHON'
          import pathlib, hashlib, json
          root=pathlib.Path('scan-output'); root.mkdir(exist_ok=True)
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'FILE_MANIFEST.json').write_text(json.dumps(files,sort_keys=True,indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uquant-closing-signals-20260918-13
          path: |
            scan-output/
            .cloud-task-journal/
          include-hidden-files: true
          retention-days: 30
