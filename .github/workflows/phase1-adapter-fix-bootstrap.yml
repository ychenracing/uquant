name: Restore Phase 1 adapter fix
on:
  push:
    branches:
      - codex/uquant-phase-1-current-head-baseline
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/.checkpoint-adapter-fix/part-* | base64 --decode > /tmp/adapter-fix.tar.xz
          test "$(sha256sum /tmp/adapter-fix.tar.xz | cut -d' ' -f1)" = "95fa0f058f4c76f49de712de5110473b87d89e5498266948ec06c8460bcf2400"
          tar -xJf /tmp/adapter-fix.tar.xz -C .
          rm -rf artifacts/.checkpoint-adapter-fix
          rm -f .github/workflows/phase1-adapter-fix-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize shared replay evidence"
          git push origin HEAD:codex/uquant-phase-1-current-head-baseline
