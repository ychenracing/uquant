name: Restore Phase 1 checkpoint
on:
  push:
    branches:
      - codex/uquant-phase-1-current-head-baseline

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/.checkpoint-phase1/part-* | base64 --decode > /tmp/phase1-checkpoint.tar.xz
          test "$(sha256sum /tmp/phase1-checkpoint.tar.xz | cut -d' ' -f1)" = "a33e0b26194f3b3e704ed2db0579eab6e100d9bf40beffc10394c00e1ac0084d"
          tar -xJf /tmp/phase1-checkpoint.tar.xz -C .
          rm -rf artifacts/.checkpoint-phase1
          rm -f .github/workflows/phase1-checkpoint-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: freeze pre-sentinel economic baseline"
          git tag -a pre-risk-sentinel-20260818 ea24f1837f8b7f2d91e73a5d3c70875f2ea98015 -m "Pre-risk-sentinel current HEAD baseline"
          git push origin HEAD:codex/uquant-phase-1-current-head-baseline
          git push origin refs/tags/pre-risk-sentinel-20260818
