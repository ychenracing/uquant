name: Restore Phase 1 current-head matrix
on:
  push:
    branches:
      - codex/uquant-phase-1-current-head-baseline
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode artifacts/.checkpoint-current-head-matrix/payload.b64 > /tmp/current-head-matrix.tar.xz
          test "$(sha256sum /tmp/current-head-matrix.tar.xz | cut -d' ' -f1)" = "aa54e586ad3a961f5de7fb914fe519e7018e9e87907a1dd3dd5402eca2a62f28"
          tar -xJf /tmp/current-head-matrix.tar.xz -C .
          rm -rf artifacts/.checkpoint-current-head-matrix
          rm -f .github/workflows/phase1-current-head-matrix-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: freeze current-head comparison matrix"
          git push origin HEAD:codex/uquant-phase-1-current-head-baseline
