name: Release Candidate Source Equality

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  source_equality:
    name: Release Candidate Source Equality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UQUANT_RELEASE_CANDIDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run release candidate source equality and contracts
        run: >-
          uv run pytest -q
          tests/architecture/test_release_acceptance.py
          tests/test_generalization_ci_contract.py
