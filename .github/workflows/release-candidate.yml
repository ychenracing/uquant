name: Release Candidate Source Equality

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  source_equality:
    name: Release Candidate Source Equality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UQUANT_RELEASE_CANDIDATE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run release candidate source equality and contracts
        run: >-
          uv run pytest -q
          tests/architecture/test_release_acceptance.py
          tests/test_generalization_ci_contract.py
