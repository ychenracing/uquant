name: Repair tooling transport

on:
  push:
    branches: [fix/main-ci-recovery-20260919]
    paths: [.github/workflows/repair-source-transport.yml]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install reviewed tool
        run: python -m pip install --disable-pip-version-check uv==0.11.33
      - name: Preserve executable and digest
        run: |
          mkdir -p "$RUNNER_TEMP/repair-tooling"
          cp "$(command -v uv)" "$RUNNER_TEMP/repair-tooling/uv"
          cd "$RUNNER_TEMP/repair-tooling"
          ./uv --version > version.txt
          sha256sum uv > uv.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-tooling-uv-0.11.33
          path: ${{ runner.temp }}/repair-tooling/
          if-no-files-found: error
          retention-days: 7
