name: Simplification workspace

on:
  push:
    branches: [codex/behavior-preserving-simplification]
    paths: [.github/workflows/simplification-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Capture immutable source and locked development runtime
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/portable-python
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv python install 3.12.13 3.12.14
          uv sync --frozen --extra dev --python "$(uv python find --managed-python 3.12.13)"
          mkdir -p "$RUNNER_TEMP/export"
          git bundle create "$RUNNER_TEMP/export/source.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/export/source-head.txt"
          git rev-parse refs/remotes/origin/main > "$RUNNER_TEMP/export/base-head.txt"
          uv run --no-sync python -c 'import sys, numpy, pandas; print(sys.version); print(numpy.__version__, pandas.__version__)' > "$RUNNER_TEMP/export/runtime.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/export/python.tar.gz" portable-python
          tar -czf "$RUNNER_TEMP/export/development-env.tar.gz" .venv/lib .venv/bin
          cp "$(command -v uv)" "$RUNNER_TEMP/export/uv"
          (cd "$RUNNER_TEMP/export" && sha256sum source.bundle python.tar.gz development-env.tar.gz uv > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simplification-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/export
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
