name: Strategic evidence closure (non-blocking)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Full resumable phase to run
        required: true
        default: assemble
        type: choice
        options:
          - assemble
          - forced-owner
          - witness-ablation
          - reachability
          - all

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"
  PYTHONHASHSEED: "0"

jobs:
  strategic-evidence:
    name: ${{ inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --extra dev
      - name: Execute or resume selected phase
        env:
          SELECTED_PHASE: ${{ inputs.phase }}
          RUNTIME_DIR: ${{ runner.temp }}/strategic-evidence-runtime
        run: >-
          uv run python -m scripts.run_strategic_evidence_closure
          --runtime-dir "${RUNTIME_DIR}"
          run --phase "${SELECTED_PHASE}" --resume
      - name: Validate assembled evidence
        if: ${{ always() && (inputs.phase == 'assemble' || inputs.phase == 'all') }}
        env:
          RUNTIME_DIR: ${{ runner.temp }}/strategic-evidence-runtime
        run: >-
          uv run python -m scripts.run_strategic_evidence_closure
          --runtime-dir "${RUNTIME_DIR}" validate
      - name: Upload compact and external evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strategic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/strategic_evidence_closure/
            ${{ runner.temp }}/strategic-evidence-runtime/
