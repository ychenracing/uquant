name: Strategic Grant Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_RELEASE: "0.11.33"

jobs:
  strategic-grant-acceptance:
    name: Strategic Grant Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_RELEASE}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Grant intent, recovery, account, and identity tests
        run: >-
          uv run pytest
          tests/test_strategic_grant_model.py
          tests/test_strategic_grant_observation.py
          tests/test_strategic_grant_identity.py
          tests/test_strategic_grant_recovery.py
          tests/test_account_schema_v3_integrity.py
          tests/test_broker_sync.py
          tests/test_strategic_forced_owner.py
      - name: Champion baseline and native eligibility replay
        run: >-
          uv run python -m tools.cloud_guard run
          --name strategic-grant-acceptance --timeout 3300 --
          uv run python scripts/run_strategic_grant_acceptance.py
          --output "$RUNNER_TEMP/strategic-grant-acceptance.json"
          --cache-dir "$RUNNER_TEMP/strategic-grant-units"
      - name: Upload acceptance facts and completed native units
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-grant-acceptance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/strategic-grant-acceptance.json
            ${{ runner.temp }}/strategic-grant-units
            .cloud-task-journal
          include-hidden-files: true
          if-no-files-found: warn
