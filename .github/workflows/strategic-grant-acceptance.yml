name: Strategic Grant Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_RELEASE: "0.11.33"

jobs:
  strategic-grant-acceptance:
    name: Strategic Grant Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_RELEASE}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Grant intent, recovery, account, and identity tests
        id: tests
        run: >-
          uv run pytest --junitxml="$RUNNER_TEMP/grant-tests.xml"
          tests/test_strategic_grant_model.py
          tests/test_strategic_grant_observation.py
          tests/test_strategic_grant_identity.py
          tests/test_strategic_grant_recovery.py
          tests/test_account_schema_v3_integrity.py
          tests/test_broker_sync.py
          tests/test_strategic_forced_owner.py
      - name: Champion baseline and native eligibility replay
        id: replay
        run: >-
          uv run python scripts/run_strategic_grant_acceptance.py
          --output "$RUNNER_TEMP/strategic-grant-acceptance.json"
      - name: Explain test and replay outcomes
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lines = ["## Grant acceptance", "", "Tests: " + os.environ["TEST_OUTCOME"],
                   "Native replay: " + os.environ["REPLAY_OUTCOME"]]
          if os.environ["REPLAY_OUTCOME"] == "skipped":
              lines.append("Economic evaluation was not run; inspect the failing test or setup step.")
          path = Path(os.environ["RUNNER_TEMP"]) / "grant-tests.xml"
          if path.is_file():
              for case in ET.parse(path).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      lines.append("- " + case.get("classname", "") + "::" + case.get("name", ""))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(lines) + "\n")
          PYCODE
      - name: Upload compact acceptance facts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-grant-acceptance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/strategic-grant-acceptance.json
            ${{ runner.temp }}/grant-tests.xml
          if-no-files-found: warn
