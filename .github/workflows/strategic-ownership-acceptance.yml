name: Strategic Ownership Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  ownership-tests:
    name: Ownership model tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Ownership, authority, universe, quorum, and execution tests
        run: >-
          uv run pytest
          tests/test_flat_book_capital_repair.py
          tests/test_strategic_cash_rearm_state.py
          tests/test_strategic_cash_rearm.py
          tests/test_strategic_capital_authority.py
          tests/test_strategic_universe_quorum.py
          tests/test_strategic_epoch.py
          tests/test_strategic_owner_continuity.py
          tests/test_strategic_successor.py
          tests/test_strategic_ownership_acceptance.py

  ownership-shard:
    name: Ownership shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - champion
          - critical
          - ghost-a
          - ghost-b
          - continuity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Restore deterministic ownership evidence cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /tmp/uquant-risk-evidence-v1
            ${{ runner.temp }}/strategic-ownership-cache
          key: >-
            strategic-ownership-${{ runner.os }}-${{ matrix.shard }}-
            ${{ hashFiles('uv.lock', 'data/frozen/SHA256SUMS',
            'benchmarks/strategic_ownership_acceptance_contract.json',
            'benchmarks/strategic_grant_acceptance_contract.json',
            'uquant/**/*.py', 'research/**/*.py',
            'scripts/run_strategic_grant_acceptance.py',
            'scripts/run_strategic_ownership_acceptance.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: >-
            strategic-ownership-${{ runner.os }}-${{ matrix.shard }}-
            ${{ hashFiles('uv.lock', 'data/frozen/SHA256SUMS',
            'benchmarks/strategic_ownership_acceptance_contract.json',
            'benchmarks/strategic_grant_acceptance_contract.json',
            'uquant/**/*.py', 'research/**/*.py',
            'scripts/run_strategic_grant_acceptance.py',
            'scripts/run_strategic_ownership_acceptance.py') }}
      - name: Run exact ownership shard
        id: execute
        run: >-
          uv run python scripts/run_strategic_ownership_acceptance.py
          --shard "${{ matrix.shard }}"
          --output "$RUNNER_TEMP/strategic-ownership-${{ matrix.shard }}.json"
          --cache-dir "$RUNNER_TEMP/strategic-ownership-cache"
      - name: Save completed raw observations after evaluation
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /tmp/uquant-risk-evidence-v1
            ${{ runner.temp }}/strategic-ownership-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Explain each ownership result
        if: ${{ always() }}
        env:
          SHARD: ${{ matrix.shard }}
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / ("strategic-ownership-" + os.environ["SHARD"] + ".json")
          lines = ["## Ownership " + os.environ["SHARD"], "", "Process: " + os.environ["EXECUTION_OUTCOME"]]
          if path.is_file():
              result = json.loads(path.read_text())
              lines.append("Overall: " + result["status"])
              for row in result["scenarios"]:
                  lines.append("- " + row["scenario_id"] + ": " + row["status"] + " / " + row.get("evaluation", "see raw evidence"))
                  if row.get("error"):
                      lines.append("  " + row["error"][:2000])
                  for failure in row.get("violations", []):
                      lines.append("  " + json.dumps(failure, ensure_ascii=False))
          else:
              lines.append("No result: economic evaluation is not available; inspect the original failing step.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(lines) + "\n")
          PYCODE
      - name: Upload compact ownership facts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            strategic-ownership-${{ github.run_id }}-attempt-
            ${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/strategic-ownership-${{ matrix.shard }}.json
          if-no-files-found: warn

  strategic-ownership-acceptance:
    name: Strategic Ownership Acceptance
    if: ${{ always() }}
    needs: [ownership-tests, ownership-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ownership models and every deterministic shard
        run: |
          tests='${{ needs.ownership-tests.result }}'
          shards='${{ needs.ownership-shard.result }}'
          printf '## Ownership required check\n\nModel tests: %s\n\nShard checks: %s\n\nSee shard summaries for invalid evidence versus valid economic misses.\n' "$tests" "$shards" >> "$GITHUB_STEP_SUMMARY"
          if [ "$tests" != "success" ] || [ "$shards" != "success" ]; then
            echo "Strategic Ownership Acceptance failed: tests=$tests shards=$shards"
            exit 1
          fi
