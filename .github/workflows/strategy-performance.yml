name: Strategy promotion

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "uquant/**"
      - "benchmarks/**"
      - "data/frozen/**"
      - ".github/workflows/strategy-performance.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Promotion matrix size
        required: true
        default: full
        type: choice
        options: [quick, full]

permissions:
  contents: read

concurrency:
  group: strategy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Verify frozen data
        run: uv run python -m uquant.validation data-manifest --data-dir data/frozen
      - name: Select matrix profile
        id: profile
        env:
          REQUESTED_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'full' || inputs.profile }}
        run: echo "value=${REQUESTED_PROFILE:-quick}" >> "$GITHUB_OUTPUT"
      - name: Run causal promotion matrix
        run: >-
          uv run python -m uquant.validation promotion
          --data-dir data/frozen
          --baseline benchmarks/promotion_baseline.json
          --profile "${{ steps.profile.outputs.value }}"
          --output promotion-report.json
      - name: Upload promotion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-promotion-${{ steps.profile.outputs.value }}
          path: promotion-report.json
