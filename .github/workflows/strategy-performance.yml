name: AI-Era performance

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "uquant/**"
      - "benchmarks/**"
      - "data/frozen/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - ".github/workflows/strategy-performance.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

concurrency:
  group: strategy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-era-performance:
    name: Full AI-Era blocking gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run full AI-Era blocking gate
        run: >-
          uv run python -m uquant.validation promotion
          --data-dir data/frozen
          --profile full
          --output benchmarks/ai_era_performance.json
      - name: Verify artifact binds the checked-out HEAD
        run: |
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          artifact = Path("benchmarks/ai_era_performance.json")
          payload = json.loads(artifact.read_text(encoding="utf-8"))
          artifact_commit = payload["provenance"]["binding"]["production_commit"]
          checkout_commit = subprocess.check_output(  # noqa: S603, S607
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if artifact_commit != checkout_commit:
              raise SystemExit(
                  f"artifact commit {artifact_commit} != checkout HEAD {checkout_commit}"
              )
          PY
      - name: Upload AI-Era performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-era-performance
          path: benchmarks/ai_era_performance.json
