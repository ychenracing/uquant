name: Extended Performance Matrix

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  ai-era-performance:
    name: Full AI-Era blocking gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run full AI-Era blocking gate
        id: performance-gate
        run: >-
          uv run python -m uquant.validation promotion
          --data-dir data/frozen
          --profile full
          --output benchmarks/ai_era_performance.json
      - name: Verify exact HEAD and full provenance
        if: ${{ always() }}
        env:
          UPSTREAM_RESULT: ${{ steps.performance-gate.outcome }}
        run: >-
          uv run python -m uquant.validation.ci_artifacts performance
          --artifact benchmarks/ai_era_performance.json
          --report-output artifacts/performance/ci/performance-validation.json
          --upstream-result "$UPSTREAM_RESULT"
          --data-dir data/frozen
      - name: Upload AI-Era performance report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-era-performance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            benchmarks/ai_era_performance.json
            artifacts/performance/ci/performance-validation.json

  current-head-matrix:
    name: Current HEAD matrix readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Validate frozen four-current-HEAD evidence
        run: uv run python -m research.current_heads

  performance-acceptance:
    name: Performance Acceptance
    if: ${{ always() }}
    needs: ai-era-performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full performance gate
        run: |
          performance='${{ needs.ai-era-performance.result }}'
          if [ "$performance" != "success" ]; then
            echo "Performance Acceptance failed: ai-era-performance=$performance"
            exit 1
          fi
