name: AI-Era performance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  ai-era-performance:
    name: Full AI-Era blocking gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run full AI-Era blocking gate
        id: phase1-gate
        run: >-
          uv run python -m uquant.validation promotion
          --data-dir data/frozen
          --profile full
          --output benchmarks/ai_era_performance.json
      - name: Verify exact HEAD and full provenance
        if: ${{ always() }}
        env:
          UPSTREAM_RESULT: ${{ steps.phase1-gate.outcome }}
        run: >-
          uv run python -m uquant.validation.ci_artifacts phase1
          --artifact benchmarks/ai_era_performance.json
          --report-output artifacts/phase1/ci/phase1-validation.json
          --upstream-result "$UPSTREAM_RESULT"
          --data-dir data/frozen
      - name: Upload AI-Era performance report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-era-performance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            benchmarks/ai_era_performance.json
            artifacts/phase1/ci/phase1-validation.json

  current-head-matrix:
    name: Current HEAD matrix readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Validate frozen four-current-HEAD evidence
        run: uv run python -m uquant.validation.current_heads

  phase1-performance:
    name: Phase 1 Performance
    if: ${{ always() }}
    needs: [ai-era-performance, current-head-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full Phase 1 gate
        run: |
          performance='${{ needs.ai-era-performance.result }}'
          matrix='${{ needs.current-head-matrix.result }}'
          if [ "$performance" != "success" ] || [ "$matrix" != "success" ]; then
            echo "Phase 1 Performance failed: ai-era-performance=$performance current-head-matrix=$matrix"
            exit 1
          fi
