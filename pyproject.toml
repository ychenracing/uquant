[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uquant"
version = "1.1.0"
description = "Causal A-share technology-sector daily quantitative decision system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy==2.5.2", "pandas==3.0.5"]

[project.optional-dependencies]
data = ["akshare>=1.17,<2"]
dev = [
    "bandit[toml]>=1.8",
    "build>=1.2",
    "hypothesis>=6.120",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[project.scripts]
uquant = "uquant.cli:main"
uquant-sentinel = "uquant.risk_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["uquant*", "research*"]

[tool.setuptools.package-data]
"uquant.validation" = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PERF", "RUF"]
ignore = ["E501", "SIM108", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["uquant"]
omit = ["uquant/__main__.py", "uquant/validation/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
